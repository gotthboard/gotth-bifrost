[[roles]]
id = "operator"
purpose = "Unprivileged web and CLI management, step-up, lockout, and recovery tests."
count = 1

[[roles]]
id = "ha-node"
purpose = "Two-node failover, fencing, duplicate-owner, and split-brain tests."
count = 2

[[roles]]
id = "traffic-generator"
purpose = "Known packet streams, hostile inputs, throughput, and completeness oracles."
count = 2

[[roles]]
id = "fabric-node"
purpose = "Three-node distributed switching, routing, firewall, quorum, partition, mobility, convergence, and rolling-recovery tests."
count = 3

[[roles]]
id = "kubernetes-controller"
purpose = "Three failure-separated Kubernetes/K3s controller members for quorum, loss, rebuild, upgrade, RBAC, and management-path tests."
count = 3

[[roles]]
id = "switch-port"
purpose = "Independent access/trunk, VLAN isolation, FDB, STP, LACP, storm, snooping, and management-path tests."
count = 4

[[roles]]
id = "service-fixture"
purpose = "DNS, DHCP, OIDC, ACME, VPN, proxy, logging, and update fixtures."
